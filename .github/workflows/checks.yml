name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m guardstudy verify --recorded-dir examples/recorded
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run bundle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -B -m unittest discover -s showcase -p 'test_*.py' -v
      - run: python -B tools/build_showcase.py --from-recorded --out "$RUNNER_TEMP/guard-study.html"
      - run: cmp docs/index.html "$RUNNER_TEMP/guard-study.html"
      - run: git diff --exit-code -- showcase/bundle.js
