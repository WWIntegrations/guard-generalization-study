<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 248" width="1240" height="248" role="img" aria-labelledby="t d">
<title id="t">Benign prompts, measured false positives</title><desc id="d">Audit public benign prompts against the declared local exposure inventory. Freeze source, model and classifier hashes before isolated base and LoRA inference. Count false positives with explicit coverage and missing-result bounds. Independently replay saved metrics without loading a model. Single-class data cannot measure attack recall. Static architecture, not an execution trace.</desc>
<style>:root{--tlo:#F4793A;--tekst:#000000;--linia:#000000;--strefa:#000000;--wezel:#8E9487;--wezel-tekst:#000000;--akcent:#000000;}text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:var(--tekst)}.n{font-size:13px;font-weight:600;fill:var(--wezel-tekst)}.p{font-size:11px;fill:var(--wezel-tekst)}.s{font-size:12px;fill:var(--strefa)}.tt{font-size:16px;font-weight:700}.wz{fill:var(--wezel);stroke:var(--linia);stroke-width:1.5}.bram{stroke:var(--akcent);stroke-width:3}.mod{stroke-dasharray:0}.st{fill:none;stroke:var(--strefa);stroke-width:1.5;stroke-dasharray:6 4}.kr{stroke:var(--linia);stroke-width:1.5;fill:none}.gr{stroke:var(--akcent);stroke-width:2.5}.gt{fill:var(--akcent)}</style>
<rect width="1240" height="248" fill="#F4793A"/>
<text class="tt" x="40" y="32">Benign prompts, measured false positives</text>
<g><rect class="st" x="16" y="72" width="464" height="160" rx="6"/><text class="s" x="26" y="88">Bounded inputs and declared exposure</text></g>
<g><rect class="st" x="512" y="72" width="216" height="160" rx="6"/><text class="s" x="522" y="88">Offline inference</text></g>
<g><rect class="st" x="760" y="72" width="464" height="160" rx="6"/><text class="s" x="770" y="88">Portable recorded evidence</text></g>
<path class="kr" d="M208 152H280"/><path class="gt" d="M288 152l-9 -5v10z"/>
<path class="kr" d="M456 152H528"/><path class="gt" d="M536 152l-9 -5v10z"/>
<path class="gr" d="M496 102V202"/>
<path class="kr" d="M704 152H776"/><path class="gt" d="M784 152l-9 -5v10z"/>
<path class="gr" d="M744 102V202"/>
<path class="kr" d="M952 152H1024"/><path class="gt" d="M1032 152l-9 -5v10z"/>
<g data-id="audit" data-typ="klient"><rect class="wz" x="40" y="116" width="168" height="72" rx="8"/>
<text class="n" x="124" y="144" text-anchor="middle">Audit exposure</text>
<text class="p" x="124" y="178" text-anchor="middle">Public text; local comparisons</text></g>
<g data-id="freeze" data-typ="bramka"><rect class="wz bram" x="288" y="116" width="168" height="72" rx="8"/>
<text class="n" x="372" y="144" text-anchor="middle">Freeze protocol</text>
<text class="p" x="372" y="178" text-anchor="middle">Data, models, fixed threshold</text></g>
<g data-id="forward" data-typ="model"><rect class="wz" x="536" y="116" width="168" height="72" rx="8"/>
<text class="n" x="620" y="144" text-anchor="middle">Base / LoRA v2</text>
<text class="p" x="620" y="178" text-anchor="middle">One isolated worker at a time</text></g>
<g data-id="count" data-typ="usluga"><rect class="wz" x="784" y="116" width="168" height="72" rx="8"/>
<text class="n" x="868" y="144" text-anchor="middle">Count false alarms</text>
<text class="p" x="868" y="178" text-anchor="middle">FP / valid; missing bounds</text></g>
<g data-id="replay" data-typ="usluga"><rect class="wz" x="1032" y="116" width="168" height="72" rx="8"/>
<text class="n" x="1116" y="144" text-anchor="middle">Verify recorded</text>
<text class="p" x="1116" y="178" text-anchor="middle">Recompute, no model load</text></g>
